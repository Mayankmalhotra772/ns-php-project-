# Redirect all HTTP to HTTPS
<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/apache-selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/private/apache-selfsigned.key

    # Strong SSL settings
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off

    # HSTS - tell browsers to always use HTTPS
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
    </Directory>

    # Block access to non-public directories
    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/controllers>
        Require all denied
    </Directory>
    <Directory /var/www/html/models>
        Require all denied
    </Directory>
    <Directory /var/www/html/middleware>
        Require all denied
    </Directory>
    <Directory /var/www/html/views>
        Require all denied
    </Directory>

    # Block access to uploads directory
    <Directory /var/uploads>
        Require all denied
    </Directory>

    # Disable server signature
    ServerSignature Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

# Hide Apache version (must be outside VirtualHost)
ServerTokens Prod
